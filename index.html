<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Opening Trainer · 1500–1600 Repertoire</title>

  <!-- Installable web app (Add to Home Screen → launches fullscreen) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a1c22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Openings" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">♞</span>
      <div>
        <h1>Opening Trainer</h1>
        <p class="tagline">A repertoire tuned for 1500–1600 rapid (10|0)</p>
      </div>
    </div>
    <nav class="tabs">
      <button id="tab-learn" class="tab active">📖 Learn</button>
      <button id="tab-test" class="tab">🎯 Test</button>
    </nav>
    <div id="stats" class="stats"></div>
  </header>

  <main class="layout">
    <section class="board-col">
      <div id="board"></div>
      <div class="board-foot">
        <span id="board-turn" class="turn"></span>
        <button id="btn-flip" class="ghost-btn" title="Flip board">⇅ Flip</button>
      </div>
    </section>

    <!-- ===================== LEARN ===================== -->
    <section id="learn-panel" class="panel">
      <div class="selectors">
        <label>Repertoire
          <select id="learn-group"></select>
        </label>
        <label>Opening
          <select id="learn-chapter"></select>
        </label>
        <label>Line
          <select id="learn-line"></select>
        </label>
      </div>

      <p id="learn-blurb" class="blurb"></p>
      <div id="learn-intro" class="intro"></div>

      <div class="moves-wrap">
        <div id="learn-moves" class="moves"></div>
      </div>

      <div class="comment-box">
        <div class="comment-label">Idea</div>
        <div id="learn-comment" class="comment"></div>
      </div>

      <div class="nav-buttons">
        <button id="btn-first" title="Start">⏮</button>
        <button id="btn-prev" title="Back">◀</button>
        <button id="btn-auto" title="Auto-play">▶ Auto</button>
        <button id="btn-next" title="Forward">▶</button>
        <button id="btn-last" title="End">⏭</button>
      </div>
    </section>

    <!-- ===================== TEST ===================== -->
    <section id="test-panel" class="panel hidden">
      <div id="test-setup">
        <h2>Spaced-repetition drills</h2>
        <p class="muted">You play your repertoire moves; the app plays the opponent. Lines you get right move further out; lines you miss come back soon.</p>
        <label>Scope
          <select id="test-group"></select>
        </label>
        <label class="check">
          <input type="checkbox" id="test-dueonly" checked />
          Only lines due for review
        </label>
        <div id="test-counts" class="counts"></div>
        <button id="btn-test-start" class="primary-btn">Start drilling</button>
      </div>

      <div id="test-active" class="hidden">
        <div id="test-progress" class="progress"></div>
        <div id="test-drillinfo" class="drillinfo"></div>
        <div id="test-prompt" class="prompt"></div>
        <div id="test-feedback" class="feedback"></div>
        <div class="test-controls">
          <button id="btn-hint" class="ghost-btn">💡 Hint</button>
          <button id="btn-reveal" class="ghost-btn">👁 Show move</button>
          <button id="btn-skip" class="ghost-btn">↷ Skip line</button>
        </div>
        <button id="btn-next-drill" class="primary-btn hidden">Next line ▶</button>
        <button id="btn-test-quit" class="link-btn">End session</button>
      </div>

      <div id="test-summary" class="hidden">
        <h2>Session complete</h2>
        <div id="summary-text" class="summary"></div>
        <button id="btn-summary-again" class="primary-btn">Drill again</button>
        <button id="btn-summary-close" class="link-btn">Back to setup</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
